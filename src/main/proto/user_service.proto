syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.grpc.proto";
option java_outer_classname = "UserServiceProto";

package userservice;

// User service definition - demonstrates different RPC types
service UserService {
  // Unary RPC: Simple request-response
  rpc GetUser (GetUserRequest) returns (UserResponse);
  
  // Server streaming RPC: One request, stream of responses
  rpc ListUsers (ListUsersRequest) returns (stream UserResponse);
  
  // Client streaming RPC: Stream of requests, one response
  rpc CreateUsers (stream CreateUserRequest) returns (CreateUsersResponse);
  
  // Bidirectional streaming RPC: Stream of requests and responses
  rpc Chat (stream ChatMessage) returns (stream ChatMessage);
}

// Message definitions
message GetUserRequest {
  int32 user_id = 1;
}

message ListUsersRequest {
  int32 page_size = 1;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
  int32 age = 3;
}

message CreateUsersResponse {
  int32 created_count = 1;
  repeated int32 user_ids = 2;
}

message UserResponse {
  int32 user_id = 1;
  string name = 2;
  string email = 3;
  int32 age = 4;
  int64 created_at = 5;
}

message ChatMessage {
  string user_name = 1;
  string message = 2;
  int64 timestamp = 3;
}
